    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF search</title>
    <script>
      // Resolve the theme before first paint, so a dark-mode reload never
      // flashes the light desk. Mirrors src/lib/theme.ts — keep the key in sync.
      (() => {
        const stored = localStorage.getItem('pdf-search:theme');
        const choice = stored === 'light' || stored === 'dark' ? stored : 'system';
        const dark =
          choice === 'dark' ||
          (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
